name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # The stores from compose.yaml. Exporting .env.test makes the DSNs explicit, so a
      # store that is down fails the run instead of skipping its tests. macOS runners have
      # no Docker: there the store-backed tests skip.
      - name: Start the test stores
        if: runner.os == 'Linux'
        run: |
          docker compose --profile clickhouse --profile iceberg --profile faults up -d --wait
          grep -v '^#' .env.test >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest

  drevo-embedded:
    # The full suite with every store and embedded drevo, where nothing may skip: a skip
    # here means a test silently stopped running. drevo-py is not on PyPI yet: it is
    # built from the pinned commit (Rust), cached by uv.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATORIUM_TEST_NO_SKIPS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Start the test stores
        run: |
          docker compose --profile clickhouse --profile iceberg --profile faults up -d --wait
          grep -v '^#' .env.test >> "$GITHUB_ENV"
      - run: uv sync --locked --group drevo
      - run: uv run --group drevo pytest
