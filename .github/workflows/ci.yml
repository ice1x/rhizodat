name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # PostgreSQL with prepared transactions enabled; a service container cannot pass -c flags.
      - name: Start PostgreSQL
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=datorium -e POSTGRES_DB=datorium \
            -p 5432:5432 postgres:16-alpine -c max_prepared_transactions=50
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres -q && break; sleep 1; done
          echo "DATORIUM_TEST_PG_DSN=postgresql://postgres:datorium@localhost:5432/datorium" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run pytest
