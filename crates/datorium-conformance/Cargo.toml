[package]
name = "datorium-conformance"
version = "0.0.0"
description = "The Rust crates against the language-neutral vectors in conformance/ (tests only)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dev-dependencies]
async-trait = "0.1"
datorium-clickhouse = { path = "../datorium-clickhouse" }
datorium-core = { path = "../datorium-core" }
datorium-drevo = { path = "../datorium-drevo" }
datorium-iceberg = { path = "../datorium-iceberg" }
datorium-postgres = { path = "../datorium-postgres" }
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde_json = "1"
uuid = "1"

[lints]
workspace = true
