[package]
name = "rhizodat-postgres"
version = "0.0.0"
description = "PostgreSQL for rhizodat-core: a two-phase store and the journal (tokio-postgres)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
rhizodat-core = { path = "../rhizodat-core", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
