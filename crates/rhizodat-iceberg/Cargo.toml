[package]
name = "rhizodat-iceberg"
version = "0.0.0"
description = "Apache Iceberg for rhizodat-core: a one-phase store committed after the decision (iceberg-rust)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arrow-array = "58"
arrow-cast = "58"
arrow-schema = "58"
arrow-select = "58"
async-trait = "0.1"
rhizodat-core = { path = "../rhizodat-core", features = ["tokio"] }
futures = "0.3"
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-s3"] }
# Only to recognise transient driver errors in an error's source chain.
opendal = { version = "0.57", default-features = false }
parquet = { version = "58", default-features = false, features = ["arrow"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
uuid = "1"

[dev-dependencies]
rhizodat-postgres = { path = "../rhizodat-postgres" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7"

[lints]
workspace = true
