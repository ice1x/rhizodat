[package]
name = "datorium-drevo"
version = "0.0.0"
description = "drevo for datorium-core: a two-phase graph store and the journal over Bolt (neo4rs)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
datorium-core = { path = "../datorium-core", features = ["tokio"] }
# A release candidate (the 0.9 line is the one with Bolt 5 and typed errors); pinned exactly.
neo4rs = "=0.9.0-rc.10"
tokio = { version = "1", features = ["sync", "time"] }
uuid = "1"

[dev-dependencies]
datorium-postgres = { path = "../datorium-postgres" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[lints]
workspace = true
