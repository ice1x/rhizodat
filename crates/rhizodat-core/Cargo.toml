[package]
name = "rhizodat-core"
version = "0.0.0"
description = "The rhizodat protocol core: identity, HLC, gids, journal, recovery"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time"], optional = true }
toml = "0.9"
uuid = "1"

[features]
# TokioTimer, for bindings and adapters on the tokio runtime.
tokio = ["dep:tokio"]

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
proptest = "1"

[lints]
workspace = true
