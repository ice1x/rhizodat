# Generates include/rhizodat.h (tests/abi.rs checks it is current).
language = "C"
header = "/* rhizodat C ABI. Generated by cbindgen from crates/rhizodat-ffi: do not edit. */"
include_guard = "RHIZODAT_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
