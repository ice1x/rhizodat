[package]
name = "rhizodat-py"
version = "0.0.0"
description = "Python bindings of the rhizodat core (the rhizodat_native module)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rhizodat_native"
crate-type = ["cdylib"]
# A Python extension links against the interpreter that loads it: tested from Python.
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312", "uuid"] }
rhizodat-core = { path = "../rhizodat-core" }
serde_json = "1"
uuid = "1"

[build-dependencies]
pyo3-build-config = "0.30"

[features]
# Leave the interpreter's symbols to the process that loads the module.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
