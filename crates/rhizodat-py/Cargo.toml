[package]
name = "rhizodat-py"
version = "0.0.0"
description = "Python bindings of the rhizodat core (the rhizodat_native module)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "rhizodat_native"
crate-type = ["cdylib"]
# A Python extension links against the interpreter that loads it: tested from Python.
test = false
doctest = false

[dependencies]
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
pyo3 = { version = "0.30", features = ["abi3-py312", "uuid"] }
rhizodat-clickhouse = { path = "../rhizodat-clickhouse" }
rhizodat-core = { path = "../rhizodat-core", features = ["tokio"] }
rhizodat-drevo = { path = "../rhizodat-drevo" }
rhizodat-postgres = { path = "../rhizodat-postgres" }
serde_json = "1"
# A current-thread runtime drives the async adapters (and their connection tasks)
# on the calling thread, so native commits keep the single-threaded property.
tokio = { version = "1", features = ["rt", "time"] }
uuid = "1"

[build-dependencies]
pyo3-build-config = "0.30"

[features]
# Leave the interpreter's symbols to the process that loads the module.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
