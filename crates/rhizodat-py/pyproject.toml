[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rhizodat-native"
version = "0.1.0a1"
description = "The rhizodat core in Rust, for the rhizodat Python package"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.maturin]
module-name = "rhizodat_native"
