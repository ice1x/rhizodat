[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datorium"
version = "0.1.0.dev0"
description = "Bitemporal polyglot data layer over PostgreSQL, ClickHouse, drevo and Apache Iceberg"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ice1x" }]
keywords = ["database", "transactions", "bitemporal", "postgresql", "clickhouse", "iceberg", "graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
clickhouse = ["clickhouse-connect>=0.8"]
# Remote drevo over Bolt. Embedded drevo needs drevo-py, which is not on PyPI
# yet and is installed from source (github.com/ice1x/drevo, drevo-py/).
drevo = ["neo4j>=5.20"]
# pyarrow writes the data files; sqlalchemy is for iceberg+sql:// catalogs.
iceberg = ["pyiceberg[pyarrow,sql-sqlite]>=0.12"]
# datorium-MCP, the MCP server shipped with datorium (the datorium-mcp command).
mcp = ["mcp>=2.3"]
# datorium.testing: the adapter contract suite for adapter authors.
testing = ["pytest>=8", "faker>=30"]

[project.scripts]
datorium = "datorium.check:main"
datorium-mcp = "datorium.mcp.server:main"

[project.urls]
Repository = "https://github.com/ice1x/datorium"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "faker>=30",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.120",
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "clickhouse-connect>=0.8",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12",
    "mcp>=2.3",
]

# Embedded drevo with two-phase commit; not on PyPI yet, so built from a pinned commit
# (needs a Rust toolchain). Install with: uv sync --group drevo
drevo = ["drevo-py"]

[tool.uv.sources]
drevo-py = { git = "https://github.com/ice1x/drevo", rev = "cf9c7664e573906f2f7e86bd15639b7c3be559fe", subdirectory = "drevo-py" }

[tool.hatch.build.targets.wheel]
packages = ["src/datorium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Spec examples in Markdown are aligned by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Optional at runtime: pyarrow, and drevo-py (built from source, only in the "drevo" group).
module = ["pyarrow", "pyarrow.*", "drevo", "drevo.*"]
ignore_missing_imports = true
