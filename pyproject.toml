[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rhizodat"
version = "0.1.0.dev0"
description = "Bitemporal polyglot data layer over PostgreSQL, ClickHouse, drevo and Apache Iceberg"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ice1x" }]
keywords = ["database", "transactions", "bitemporal", "postgresql", "clickhouse", "iceberg", "graph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
clickhouse = ["clickhouse-connect>=0.8"]
# Remote drevo over Bolt. Embedded drevo needs drevo-py, which is not on PyPI
# yet and is installed from source (github.com/ice1x/drevo, drevo-py/).
drevo = ["neo4j>=5.20"]
# pyarrow writes the data files; sqlalchemy is for iceberg+sql:// catalogs.
iceberg = ["pyiceberg[pyarrow,sql-sqlite]>=0.12"]
# rhizodat.ingest: file imports with schema inference (rhizodat import).
ingest = ["pyarrow>=17", "rdflib>=7"]
# rhizodat-MCP, the MCP server shipped with rhizodat (the rhizodat-mcp command).
mcp = ["mcp>=2.3"]
# rhizodat.testing: the adapter contract suite for adapter authors.
testing = ["pytest>=8", "faker>=30"]

[project.scripts]
rhizodat = "rhizodat.check:main"
rhizodat-mcp = "rhizodat.mcp.server:main"

[project.urls]
Repository = "https://github.com/ice1x/rhizodat"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "faker>=30",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.120",
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "clickhouse-connect>=0.8",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12",
    "mcp>=2.3",
    "rdflib>=7",
    "rhizodat-ontology",
]

# The documentation site: uv run --group docs mkdocs serve
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]

# Embedded drevo with two-phase commit; not on PyPI yet, so built from a pinned commit
# (needs a Rust toolchain). Install with: uv sync --group drevo
drevo = ["drevo-py"]

# The core in Rust (crates/rhizodat-py, built with maturin; needs a Rust toolchain).
# The package uses it when installed: uv sync --group native
native = ["rhizodat-native"]

[tool.uv.workspace]
# rhizodat-ontology: an LLM plugin, a package of its own (plugins/).
members = ["plugins/*"]

[tool.uv.sources]
rhizodat-ontology = { workspace = true }
rhizodat-native = { path = "crates/rhizodat-py" }
drevo-py = { git = "https://github.com/ice1x/drevo", rev = "cf9c7664e573906f2f7e86bd15639b7c3be559fe", subdirectory = "drevo-py" }

[tool.hatch.build.targets.wheel]
packages = ["src/rhizodat"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/rhizodat-ontology/tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rhizodat"]
branch = true

[tool.coverage.report]
# The CI job running every test (drevo-embedded) fails below this.
fail_under = 92
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "^\\s*\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Spec examples in Markdown are aligned by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "plugins/rhizodat-ontology/src", "plugins/rhizodat-ontology/tests"]

[[tool.mypy.overrides]]
# Optional at runtime: pyarrow, and drevo-py (built from source, only in the "drevo" group).
module = ["pyarrow", "pyarrow.*", "drevo", "drevo.*"]
ignore_missing_imports = true
