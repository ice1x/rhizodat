[workspace]
resolver = "3"
members = ["crates/datorium-core", "crates/datorium-drevo", "crates/datorium-postgres"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ice1x/datorium"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
