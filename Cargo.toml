[workspace]
resolver = "3"
members = ["crates/rhizodat-clickhouse", "crates/rhizodat-conformance", "crates/rhizodat-core", "crates/rhizodat-drevo", "crates/rhizodat-iceberg", "crates/rhizodat-postgres", "crates/rhizodat-py"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ice1x/rhizodat"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
