site_name: rhizodat
site_description: A bitemporal polyglot data layer over PostgreSQL, ClickHouse, drevo and Apache Iceberg
repo_url: https://github.com/ice1x/rhizodat
repo_name: ice1x/rhizodat
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  icon:
    logo: material/mushroom
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.snippets: { base_path: ["."], check_paths: true }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
            show_signature_annotations: true
            separate_signature: true

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Examples: examples.md
  - Concepts:
      - Principles: concepts/principles.md
      - Stores and capabilities: concepts/stores.md
      - Identity and mapping: concepts/identity.md
      - Meta-transactions: concepts/transactions.md
      - Time: concepts/time.md
  - Guides:
      - API tour: guide/api.md
      - Repository: guide/repository.md
      - Schema migrations: guide/migrations.md
      - File imports: guide/imports.md
      - rhizodat-MCP: guide/mcp.md
  - Adapters:
      - Writing an adapter: adapters/index.md
      - Contracts and plug-ins: adapters/contracts.md
  - API reference:
      - rhizodat: reference/rhizodat.md
      - Repository: reference/repository.md
      - Migrations: reference/migrations.md
      - Imports: reference/ingest.md
      - Adapters and capabilities: reference/adapter.md
      - Testing: reference/testing.md
  - Development:
      - Contributing: development/index.md
      - Package structure: development/package.md
      - Plan: plan.md

validation:
  links:
    anchors: warn
    unrecognized_links: warn
